# TROP local stack (home PC / judges): the REAL product. Project name `trop`; ports bound to 127.0.0.1 (override TROP_BIND=10.8.0.3).
#   docker compose -f deploy/compose.yml up -d --build                    # real engine + seeded DB; offline engine/capture, no key needed
#   docker compose -f deploy/compose.yml --profile mock up -d api-mock    # fictional demo universe on :${TROP_MOCK_PORT:-18002} (explicit only)
# The image carries deploy/bundle (run deploy/make_bundle.sh after data/ changes); the trop-data volume is seeded from it on
# start (never overwriting existing files) and the api restores the Postgres seed on an empty DB (TROP_DB_SEED=1).
# Modes: TROP_NO_LIVE=1 + TROP_CAPTURE=off = offline engine/capture; LLM features go live when GEMINI_API_KEY is set (.env).
# Live capture: TROP_CAPTURE=local with `uv run trop worker` on the host, or sandbox where a docker socket is available.
# NOTE (home PC): the dev DB `redpill-db-postgres-1` already holds 55432, so this stack publishes Postgres on
# ${TROP_PG_PORT:-55433}. Inside the stack services talk over the network (postgres:5432, redis:6379).
name: trop

x-backend-env: &backend-env
  DATABASE_URL: postgresql://trop:${POSTGRES_PASSWORD:-trop_dev}@postgres:5432/trop
  REDIS_URL: redis://redis:6379/0
  TROP_MODE: ${TROP_MODE:-live}
  TROP_NO_LIVE: ${TROP_NO_LIVE:-1}
  TROP_CAPTURE: ${TROP_CAPTURE:-off}
  LLM_BUDGET_USD: ${LLM_BUDGET_USD:-10}
  DATA_DIR: /data
  ARTIFACT_DIR: /data/artifacts
  CACHE_DIR: /data/cache
  MODELS_DIR: /data/models
  REPLAY_DIR: /data/replay

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: trop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trop_dev}
      POSTGRES_DB: trop
    command: postgres -c shared_buffers=512MB -c work_mem=32MB -c jit=off
    ports: ["${TROP_BIND:-127.0.0.1}:${TROP_PG_PORT:-55433}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    mem_limit: 1536m
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U trop -d trop"], interval: 5s, timeout: 3s, retries: 30}
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    command: redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru --save ""
    ports: ["${TROP_BIND:-127.0.0.1}:${TROP_REDIS_PORT:-56379}:6379"]
    mem_limit: 256m
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20}
    restart: unless-stopped

  api:
    build: {context: .., dockerfile: deploy/Dockerfile.api}
    image: trop-api
    command: ["trop", "serve", "--host", "0.0.0.0", "--port", "8000"]
    env_file: [{path: ../.env, required: false}]
    environment:
      <<: *backend-env
      TROP_DB_SEED: "1"
    ports: ["${TROP_BIND:-127.0.0.1}:${TROP_API_PORT:-18000}:8000"]
    volumes: [trop-data:/data]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
    healthcheck: {test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/v1/health || exit 1"], interval: 15s, timeout: 5s, retries: 20, start_period: 120s}
    mem_limit: 1g
    restart: unless-stopped

  worker:      # runs analyses (incl. URL capture): TROP_WORKER_DOCKERFILE=deploy/Dockerfile.worker once WS5's Chromium image exists
    build: {context: .., dockerfile: "${TROP_WORKER_DOCKERFILE:-deploy/Dockerfile.api}"}
    image: trop-worker
    shm_size: 256m
    command: ["trop", "worker"]
    healthcheck: {disable: true}
    env_file: [{path: ../.env, required: false}]
    environment:
      <<: *backend-env
      TROP_SCHEDULER: ${TROP_SCHEDULER:-0}
    volumes: [trop-data:/data]
    depends_on: {api: {condition: service_healthy}}
    mem_limit: 1536m
    restart: unless-stopped

  api-mock:      # explicit fictional demo universe (judge fallback); never the default
    profiles: [mock]
    build: {context: .., dockerfile: deploy/Dockerfile.api}
    image: trop-api
    command: ["trop", "serve", "--mock", "--host", "0.0.0.0", "--port", "8000"]
    environment: {TROP_MODE: mock, REPLAY_DIR: /data/replay, TROP_SKIP_DATA_SEED: "1"}
    ports: ["${TROP_BIND:-127.0.0.1}:${TROP_MOCK_PORT:-18002}:8000"]
    mem_limit: 512m
    restart: unless-stopped

  web:
    build: {context: ../web, dockerfile: Dockerfile}
    environment:
      API_INTERNAL_URL: http://api:8000
      PORT: "3000"
      NEXT_PUBLIC_API_BASE: /api/v1
    ports: ["${TROP_BIND:-127.0.0.1}:${TROP_WEB_PORT:-13000}:3000"]
    depends_on: [api]
    mem_limit: 512m
    restart: unless-stopped

volumes:
  pgdata:
  trop-data:
